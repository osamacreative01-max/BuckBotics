# BUCKBOTICS - nginx site for a self-managed VPS (Bluehost VPS/VDS or any
# Linux box). nginx terminates TLS and proxies to the Next.js process that
# PM2 keeps alive on 127.0.0.1:3000.
#
# Install:
#   sudo cp deploy/nginx-buckbotics.conf /etc/nginx/sites-available/buckbotics
#   sudo ln -s /etc/nginx/sites-available/buckbotics /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d www.buckbotics.com -d buckbotics.com   # TLS + redirects
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace every /home/USER path with your cPanel/SSH username.

server {
    listen 80;
    listen [::]:80;
    server_name buckbotics.com www.buckbotics.com;

    # Real client IP behind the proxy chain, for the enquiry throttle log.
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               image/svg+xml application/xml+rss text/xml;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # The enquiry POST must not be cached or buffered away.
    location = /contact {
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # Never serve the lead store or dotfiles, even if the tree moves.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
